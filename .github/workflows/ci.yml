name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# When a newer commit is pushed to the same branch or pull request, cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Cache the pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run the pre-commit hooks on every file
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install the package with its test dependencies
        run: uv pip install --system ".[test]"
      - name: Run the fast tests
        run: pytest -m "not slow" -ra

  slow-tests:
    name: Slow tests (multiprocess sampling)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: pyproject.toml
      - name: Install the package with its test dependencies
        run: uv pip install --system ".[test]"
      - name: Run the slow tests
        run: pytest -m slow -ra
