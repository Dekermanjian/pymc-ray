[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pymc-ray"
version = "0.1.0"
description = "Scale PyMC models to large datasets with Ray."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Jonathan Dekermanjian", email = "jonathan.dekermanjian@gmail.com" }]
keywords = ["bayesian", "pymc", "ray", "mcmc", "distributed"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "pymc>=6.3",
    "ray[data]>=2.40",
    "narwhals>=2.0",
    "numpy",
    "pandas",
    "pyarrow",
    "xarray",
    "cloudpickle",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest>=8", "polars", "nutpie>=0.16.10"]
dev = ["pytest>=8", "polars", "nutpie>=0.16.10", "ruff", "pre-commit", "matplotlib", "h5netcdf", "h5py", "ray[default]"]
docs = ["sphinx>=8", "pydata-sphinx-theme", "numpydoc", "myst-nb", "sphinx-copybutton", "sphinxcontrib-mermaid"]

[project.urls]
Documentation = "https://pymc-ray.readthedocs.io"
Repository = "https://github.com/Dekermanjian/pymc-ray"

[tool.hatch.build.targets.wheel]
packages = ["src/pymc_ray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: multiprocess sampling tests (deselect with '-m \"not slow\"')"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:.*object mode.*:UserWarning",
]

[tool.ruff]
line-length = 150
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["pymc_ray"]
known-local-folder = ["helpers", "models"]
